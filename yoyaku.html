<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rian ご予約</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rian予約" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  :root {
    --page:#EDEAE4; --card:#F4F1EA; --dark:#2B2B29; --text:#2B2B29; --muted:#8B8478;
    --faint:#A39A89; --soft:#6B6459; --accent:#8B6F47; --accent-soft:#D9A566; --border:#DDD8CD; --danger:#8B4A3B;
  }
  body { background:var(--page); color:var(--text); font-family:'Zen Kaku Gothic New',sans-serif; min-height:100vh; }
  #app { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 28px) 20px 64px; }
  .serif { font-family:'Shippori Mincho',serif; font-weight:700; }
  header { text-align:center; margin-bottom:28px; }
  header p { margin:0 0 6px; font-size:11px; letter-spacing:.35em; color:var(--faint); }
  header h1 { margin:0; font-size:26px; }
  header .sub { margin-top:8px; font-size:14px; color:var(--soft); letter-spacing:0; }
  .msg { text-align:center; color:var(--faint); font-weight:300; padding:80px 0; line-height:1.9; }
  .nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nav b { font-size:17px; font-weight:500; }
  .nav button { width:44px; height:44px; border-radius:999px; border:none; background:transparent; color:var(--soft); font-size:20px; cursor:pointer; }
  .nav button:active { background:var(--card); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .wd { text-align:center; font-size:12px; color:var(--faint); padding-bottom:4px; }
  .wd.sun { color:var(--danger); }
  .cell { aspect-ratio:1; border-radius:4px; border:1px solid transparent; background:transparent; color:var(--soft); font:inherit; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .cell:disabled { color:var(--border); cursor:default; }
  .cell.has { background:rgba(217,165,102,.15); border-color:rgba(217,165,102,.4); color:var(--text); }
  .cell.picked { background:var(--dark); color:var(--page); border-color:var(--dark); }
  .cell i { width:4px; height:4px; border-radius:999px; background:var(--accent); margin-top:2px; }
  .cell.picked i { background:var(--accent-soft); }
  h2 { font-size:17px; margin:32px 0 12px; }
  .slot { width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:4px; padding:13px 16px; margin-bottom:8px; font:inherit; font-size:15px; color:var(--text); cursor:pointer; text-align:left; }
  .slot .t { font-variant-numeric:tabular-nums; }
  .slot .s { font-size:13px; color:var(--accent); }
  .slot.mine { background:var(--dark); color:var(--page); border-color:var(--dark); }
  .slot.mine .s { color:var(--accent-soft); }
  .slot.taken, .slot.blocked, .slot.past { cursor:default; }
  .slot.taken .s, .slot.blocked .s, .slot.past .s { color:var(--faint); }
  .slot.past { opacity:.45; }
  .slot.tr.taken, .slot.tr.blocked { cursor:pointer; }
  .btn { width:100%; padding:11px; border-radius:4px; border:1px solid var(--accent); background:transparent; color:var(--accent); font:inherit; font-size:15px; cursor:pointer; margin-bottom:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:4px; padding:12px 16px; margin-bottom:8px; font-size:15px; }
  .row button { border:none; background:transparent; color:var(--danger); font:inherit; font-size:14px; cursor:pointer; padding:6px 0 6px 12px; }
  .note { color:var(--faint); font-size:13px; font-weight:300; margin:0 0 12px; }
  .err { background:var(--danger); color:var(--page); text-align:center; font-size:14px; padding:8px 16px; border-radius:4px; margin-bottom:16px; }
</style>
</head>
<body>
<div id="app"><p class="msg">読み込み中...</p></div>
<script>
"use strict";
const PROJECT = "rian-apps-b3e7b";
const DB = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;
const RES = `${DB}/rianReserve`;                                   // 予約データ専用(記録データとは別コレクション)
const MEMBERS = `${DB}/rianData/${encodeURIComponent("rian:members")}`; // 既存の会員リスト(読み取りのみ)
const TRAINER_PIN = "0524";   // トレーナー用の暗証番号(好きな数字に変更してください)
const FIRST_HOUR = 9, LAST_HOUR = 22;  // 9:00〜23:00(1枠60分、最終枠は22:00開始)
const WD = ["日","月","火","水","木","金","土"];

const q = new URLSearchParams(location.search);
let memberId = q.get("id"), me = null, isTrainer = false;
let docs = {}, view = new Date(), picked = null, busy = false, error = "";
view.setDate(1);

const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const label = (date) => { const d = new Date(date + "T00:00:00"); return `${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`; };
const slotStart = (date, h) => new Date(`${date}T${pad(h)}:00:00`);
const isPast = (date, h) => slotStart(date, h) <= new Date();
const has = (k) => k in docs;

async function load() {
  let token = "", out = {};
  do {
    const r = await fetch(`${RES}?pageSize=300${token ? `&pageToken=${token}` : ""}`);
    if (!r.ok) throw new Error("load");
    const j = await r.json();
    (j.documents || []).forEach((d) => {
      const id = d.name.split("/").pop();
      try { out[id] = JSON.parse(d.fields.value.stringValue); } catch (e) { out[id] = {}; }
    });
    token = j.nextPageToken || "";
  } while (token);
  docs = out;
}
// 同じ枠のドキュメントがすでにあれば作成に失敗する(二重予約防止)
async function create(id, obj) {
  const r = await fetch(`${RES}/${id}?currentDocument.exists=false`, {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(obj) } } }),
  });
  return r.ok;
}
async function remove(id) { await fetch(`${RES}/${id}`, { method: "DELETE" }); }

async function act(fn) {
  if (busy) return;
  busy = true; error = "";
  try { await fn(); await load(); }
  catch (e) { error = "通信に失敗しました。電波の良い場所でもう一度お試しください。"; }
  busy = false; render();
}

function resDates() {
  const set = new Set();
  Object.keys(docs).forEach((k) => {
    if (k[0] !== "r") return;
    if (isTrainer || docs[k].m === memberId) set.add(k.split("_")[1]);
  });
  return set;
}

function render() {
  const app = document.getElementById("app");
  const title = isTrainer ? "トレーナー管理" : `${esc(me.name)} さん`;
  let h = `<header><p>RIAN RESERVATION</p><h1 class="serif">ご予約</h1><div class="sub">${title}</div></header>`;
  if (error) h += `<div class="err">${esc(error)}</div>`;

  const y = view.getFullYear(), m = view.getMonth();
  const dates = resDates(), today = ymd(new Date());
  h += `<div class="nav"><button data-a="nav" data-d="-1" aria-label="前の月">‹</button><b>${y}年${m + 1}月</b><button data-a="nav" data-d="1" aria-label="次の月">›</button></div>`;
  h += `<div class="grid">` + WD.map((w, i) => `<div class="wd${i === 0 ? " sun" : ""}">${w}</div>`).join("");
  for (let i = 0; i < new Date(y, m, 1).getDay(); i++) h += `<div></div>`;
  for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
    const dt = new Date(y, m, d), date = ymd(dt);
    const off = dt.getDay() === 0 || date < today || (!isTrainer && has("d_" + date));
    const cls = ["cell", date === picked ? "picked" : "", dates.has(date) ? "has" : ""].join(" ");
    h += `<button class="${cls}" data-a="day" data-date="${date}" ${off ? "disabled" : ""}>${d}${dates.has(date) ? "<i></i>" : ""}</button>`;
  }
  h += `</div>`;

  if (picked) {
    h += `<h2 class="serif">${label(picked)}</h2>`;
    if (isTrainer) {
      h += `<button class="btn" data-a="dayblock" data-date="${picked}">${has("d_" + picked) ? "この日の休みを解除する" : "この日を休みにする"}</button>`;
      if (has("d_" + picked)) h += `<p class="note">休みの日は、会員さんから予約できません。</p>`;
    }
    for (let hr = FIRST_HOUR; hr <= LAST_HOUR; hr++) {
      const hh = pad(hr), r = docs[`r_${picked}_${hh}`], b = has(`b_${picked}_${hh}`);
      let cls = "slot", st = "予約する";
      if (r) {
        if (!isTrainer && r.m === memberId) { cls += " mine"; st = "あなたの予約(タップで取消)"; }
        else { cls += " taken"; st = isTrainer ? `${esc(r.n || "予約済み")} さん` : "予約済み"; }
      } else if (b) { cls += " blocked"; st = isTrainer ? "ブロック中(タップで解除)" : "受付停止"; }
      else if (isPast(picked, hr)) { cls += " past"; st = "終了"; }
      else if (isTrainer) st = "タップでブロック";
      if (isTrainer) cls += " tr";
      h += `<button class="${cls}" data-a="slot" data-date="${picked}" data-h="${hr}"><span class="t">${hr}:00 – ${hr + 1}:00</span><span class="s">${st}</span></button>`;
    }
  } else {
    h += `<p class="note" style="margin-top:20px;text-align:center">日付をタップすると、空いている時間が表示されます。</p>`;
  }

  if (!isTrainer) {
    const mine = Object.keys(docs).filter((k) => k[0] === "r" && docs[k].m === memberId && slotStart(k.split("_")[1], +k.split("_")[2]) > new Date()).sort();
    h += `<h2 class="serif">ご自身の予約</h2>`;
    h += mine.length ? mine.map((k) => { const [, d, hh] = k.split("_"); return `<div class="row"><span>${label(d)} ${+hh}:00〜</span><button data-a="cancel" data-k="${k}">取り消す</button></div>`; }).join("") : `<p class="note">現在の予約はありません。</p>`;
  }
  app.innerHTML = h;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, date = t.dataset.date;
  if (a === "nav") { view.setMonth(view.getMonth() + (+t.dataset.d)); render(); return; }
  if (a === "day") { picked = date; render(); return; }
  if (a === "dayblock") {
    act(async () => { has("d_" + date) ? await remove("d_" + date) : await create("d_" + date, {}); });
    return;
  }
  if (a === "cancel") {
    if (confirm("この予約を取り消しますか?")) act(() => remove(t.dataset.k));
    return;
  }
  if (a === "slot") {
    const hr = +t.dataset.h, hh = pad(hr), rk = `r_${date}_${hh}`, bk = `b_${date}_${hh}`, r = docs[rk];
    const when = `${label(date)} ${hr}:00〜${hr + 1}:00`;
    if (isTrainer) {
      if (r) { if (confirm(`${when}\n${r.n || ""}さんの予約を取り消しますか?`)) act(() => remove(rk)); }
      else if (has(bk)) act(() => remove(bk));
      else act(() => create(bk, {}));
      return;
    }
    if (r && r.m === memberId) { if (confirm(`${when}\nこの予約を取り消しますか?`)) act(() => remove(rk)); return; }
    if (r || has(bk) || isPast(date, hr)) return;
    if (confirm(`${when}\nこの日時で予約しますか?`)) {
      act(async () => {
        const ok = await create(rk, { m: memberId, n: me.name });
        if (!ok) error = "この時間はすでに予約が入りました。別の時間をお選びください。";
      });
    }
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && me !== null) act(async () => {}); });

function message(text) { document.getElementById("app").innerHTML = `<p class="msg">${text}</p>`; }

(async function init() {
  try {
    if (q.has("trainer")) {
      if (localStorage.getItem("rianPin") !== TRAINER_PIN) {
        const p = prompt("暗証番号を入力してください");
        if (p !== TRAINER_PIN) { message("暗証番号が違います。"); return; }
        localStorage.setItem("rianPin", p);
      }
      isTrainer = true; me = {};
    } else {
      if (!memberId) { message("ページが見つかりません。<br>トレーナーにリンクを再度確認してもらってください。"); return; }
      const r = await fetch(MEMBERS);
      const j = r.ok ? await r.json() : null;
      const list = j ? JSON.parse(j.fields.value.stringValue) : [];
      me = list.find((x) => x.id === memberId);
      if (!me) { message("ページが見つかりません。<br>トレーナーにリンクを再度確認してもらってください。"); return; }
    }
    await load(); render();
  } catch (e) { message("読み込みに失敗しました。通信環境をご確認のうえ、もう一度開いてみてください。"); }
})();
</script>
</body>
</html>
