<style>

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior-y: none; }

  :root {
    --rn-page: #FBFAF8;
    --rn-card: #F6F4F0;
    --rn-card-hover: #FFFFFF;
    --rn-dark: #2B2B29;
    --rn-dark-hover: #403F3A;
    --rn-text: #2B2B29;
    --rn-muted: #8B8478;
    --rn-faint: #A39A89;
    --rn-soft: #6B6459;
    --rn-accent: #8B6F47;
    --rn-accent-soft: #D9A566;
    --rn-border: #E8E4DB;
    --rn-danger: #8B4A3B;
  }
  .rn-app { background: var(--rn-page); color: var(--rn-text); font-family: 'Zen Kaku Gothic New', sans-serif; min-height: 100vh; padding-top: calc(env(safe-area-inset-top) + 20px); }
  .rn-serif { font-family: 'Shippori Mincho', serif; font-weight: 700; }
  .rn-eyebrow { letter-spacing: 0.35em; color: var(--rn-faint); font-size: 11px; }
  .rn-muted { color: var(--rn-muted); }
  .rn-faint { color: var(--rn-faint); }
  .rn-soft { color: var(--rn-soft); }
  .rn-accent-text { color: var(--rn-accent); }
  .rn-error-banner { background: var(--rn-danger); color: var(--rn-page); font-size: 14px; text-align: center; padding: 8px 16px; }

  .rn-row { background: var(--rn-card); border: 1px solid var(--rn-border); transition: background-color .15s ease; border-radius: 4px; }
  .rn-row:hover { background: var(--rn-card-hover); }

  .rn-avatar { background: rgba(217,165,102,0.2); color: var(--rn-accent); width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .rn-icon-btn { color: var(--rn-faint); background: transparent; border: none; cursor: pointer; transition: color .15s ease; padding: 4px; font-size: 16px; line-height: 1; }
