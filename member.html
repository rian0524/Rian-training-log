const RES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${GYM.id}Reserve`;
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const slotDate = (date, hr) => new Date(`${date}T${pad(hr)}:00:00`);
async function resLoad() {
    let token = "", out = {};
    do {
        const r = await fetch(`${RES}?pageSize=300${token ? `&pageToken=${token}` : ""}`);
        if (!r.ok) throw new Error("load");
        const j = await r.json();
        (j.documents || []).forEach((d) => { const k = d.name.split("/").pop(); try { out[k] = JSON.parse(d.fields.value.stringValue); } catch (e) { out[k] = {}; } });
        token = j.nextPageToken || "";
    } while (token);
    return out;
}
async function resPut(id, obj, onlyNew) {
    const r = await fetch(`${RES}/${id}${onlyNew ? "?currentDocument.exists=false" : ""}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(obj) } } }) });
    return r.ok;
}
async function resDel(id) { await fetch(`${RES}/${id}`, { method: "DELETE" }); }
// その枠が、そのトレーナーに対して埋まっているか(誰の予約かは、ここでは分からない)
function busyFor(docs, ds, hr, t) {
    if (new Date(ds + "T00:00:00").getDay() === 0 || `d_${ds}` in docs) return true;
    const hh = pad(hr);
    return Object.keys(docs).some((k) => { const p = k.split("_"); return (p[0] === "r" || p[0] === "b") && p[1] === ds && p[2] === hh && (!p[3] || p[3] === "store" || p[3] === t); });
}

            h("div", { style: { flex: 1, minWidth: 150 } }, h("div", { style: { fontSize: 15 } }, `${formatDateJP(r.d)} ${r.hr}:00〜${r.hr + 1}:00`), h("div", { className: "rn-muted", style: { fontSize: 13, display: "flex", alignItems: "center", gap: 6 } }, h("i", { style: { width: 9, height: 9, borderRadius: 3, background: tCol(r.t), display: "inline-block" } }), tName(r.t) || "担当トレーナー")),
