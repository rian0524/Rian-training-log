<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior-y: none; }

  :root {
    --rn-page: #FBFAF8;
    --rn-card: #F6F4F0;
    --rn-card-hover: #FFFFFF;
    --rn-dark: #2B2B29;
    --rn-dark-hover: #403F3A;
    --rn-text: #2B2B29;
    --rn-muted: #8B8478;
    --rn-faint: #A39A89;
    --rn-soft: #6B6459;
    --rn-accent: #8B6F47;
    --rn-accent-soft: #D9A566;
    --rn-border: #E8E4DB;
    --rn-danger: #8B4A3B;
  }
  .rn-app { background: var(--rn-page); color: var(--rn-text); font-family: 'Zen Kaku Gothic New', sans-serif; min-height: 100vh; padding-top: calc(env(safe-area-inset-top) + 20px); }
  .rn-serif { font-family: 'Shippori Mincho', serif; font-weight: 700; }
  .rn-eyebrow { letter-spacing: 0.35em; color: var(--rn-faint); font-size: 11px; }
  .rn-muted { color: var(--rn-muted); }
  .rn-faint { color: var(--rn-faint); }
  .rn-soft { color: var(--rn-soft); }
  .rn-accent-text { color: var(--rn-accent); }
  .rn-error-banner { background: var(--rn-danger); color: var(--rn-page); font-size: 14px; text-align: center; padding: 8px 16px; }

  .rn-row { background: var(--rn-card); border: 1px solid var(--rn-border); transition: background-color .15s ease; border-radius: 4px; }
  .rn-row:hover { background: var(--rn-card-hover); }

  .rn-avatar { background: rgba(217,165,102,0.2); color: var(--rn-accent); width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .rn-icon-btn { color: var(--rn-faint); background: transparent; border: none; cursor: pointer; transition: color .15s ease; padding: 4px; font-size: 16px; line-height: 1; }
  .rn-icon-btn-lg { color: var(--rn-faint); background: transparent; border: none; cursor: pointer; transition: color .15s ease; line-height: 1; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; margin: -8px; }
  .rn-icon-btn-lg:active { background: var(--rn-card); }
  .rn-icon-btn:hover { color: var(--rn-text); }
  .rn-icon-btn.danger:hover { color: var(--rn-danger); }
  .rn-icon-btn.accent:hover { color: var(--rn-accent); }

  .rn-fab {
    background: var(--rn-dark); color: var(--rn-page); border: none; cursor: pointer;
    transition: background-color .15s ease; position: fixed; bottom: 32px; right: 32px;

const RES = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/${GYM.id}Reserve`;
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const slotDate = (date, hr) => new Date(`${date}T${pad(hr)}:00:00`);
const ST = { booked: "予約", done: "受講済み", noshow: "当日キャンセル" };
const stOf = (r) => r.st || "booked";
async function resLoad() {
    let token = "", out = {};
    do {
        const r = await fetch(`${RES}?pageSize=300${token ? `&pageToken=${token}` : ""}`);
        if (!r.ok) throw new Error("load");
        const j = await r.json();
        (j.documents || []).forEach((d) => {
            try { out[d.name.split("/").pop()] = JSON.parse(d.fields.value.stringValue); } catch (e) { out[d.name.split("/").pop()] = {}; }
        });
        token = j.nextPageToken || "";
    } while (token);
    return out;
}
// onlyNew=true: 同じ枠がすでにあれば失敗する(二重予約の防止)
async function resPut(id, obj, onlyNew) {
    const r = await fetch(`${RES}/${id}${onlyNew ? "?currentDocument.exists=false" : ""}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields: { value: { stringValue: JSON.stringify(obj) } } }),
    });
    return r.ok;
}
async function resDel(id) { await fetch(`${RES}/${id}`, { method: "DELETE" }); }
function StTag({ r }) { return h("span", { className: "rv-tag " + stOf(r) }, ST[stOf(r)]); }
function ResvRow({ r, onOpen, withDate }) {
    return h("button", { className: "rn-row rv-row", onClick: () => onOpen(r) },

}
function HomeView({ list, onOpen }) {
    const now = new Date(), t = ymd(now), tm = ymd(new Date(now.getTime() + 864e5));

    const today = list.filter((r) => r.d === t), tomorrow = list.filter((r) => r.d === tm);
    const left = today.filter((r) => booked(r) && slotDate(r.d, r.h + 1) > now);

        h("div", null, h("b", { style: { fontSize: 28 } }, n), " 件"),
        h("div", { className: "rn-faint", style: { fontSize: 12, minHeight: 16 } }, sub));

        h("div", { className: "rv-cards" },

        h("p", { className: "rn-muted", style: { fontSize: 13, textAlign: "center" } }, `${today.length}件(受講済み ${cnt("done")}・当日キャンセル ${cnt("noshow")}・残り ${left.length})`));
