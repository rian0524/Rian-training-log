  .rn-fab {

  .rn-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--rn-faint); }

  .rn-fav-chip { background: transparent; color: var(--rn-accent); border: 1px solid rgba(217,165,102,0.5); cursor: pointer; transition: all .15s ease; border-radius: 999px; padding: 6px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }

<script>
"use strict";
const { useState, useEffect, useMemo, useRef } = React;
// ---- localStorage をベースにした保存API(Claude環境のwindow.storageと同じ形に合わせる) ----
const FIREBASE_PROJECT_ID = "rian-apps-b3e7b";
const FIRESTORE_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/rianData`;

function fsDecode(doc) {
  // Firestoreのドキュメント形式からvalue文字列を取り出す
  const v = doc?.fields?.value?.stringValue;
  return v !== undefined ? v : null;
}

const storage = {
  async get(key) {
    try {
      const res = await fetch(`${FIRESTORE_BASE}/${encodeURIComponent(key)}`);
      if (res.status === 404) {
        // クラウドにまだ無ければ、端末内の古いデータがあるか確認(移行用)
        const local = window.localStorage.getItem(key);
        return local === null ? null : { key, value: local };
      }
      if (!res.ok) throw new Error("Firestore get failed: " + res.status);
      const data = await res.json();
      const value = fsDecode(data);
      if (value === null) return null;
      window.localStorage.setItem(key, value); // 直近の値をキャッシュしておく
      return { key, value };
    } catch (e) {
      // 通信できない場合は、端末内の最後の値でとりあえず動かす
      const local = window.localStorage.getItem(key);
      if (local === null) throw e;
      return { key, value: local };
    }
  },
  async set(key, value) {
    window.localStorage.setItem(key, value); // 即座にローカルにも反映(体感速度のため)
    const body = { fields: { value: { stringValue: value } } };
    const res = await fetch(`${FIRESTORE_BASE}/${encodeURIComponent(key)}?updateMask.fieldPaths=value`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("Firestore set failed: " + res.status);
    return { key, value };
  },
};
// ---- 部位 -> 種目 マスタ ----
const BODY_PARTS = {
    "脚": ["スクワット", "レッグプレス", "レッグエクステンション", "レッグカール", "ランジ"],
    "臀筋": ["ヒップスラスト", "ブルガリアンスクワット", "ヒップアブダクション", "グルートブリッジ", "ケーブルキックバック"],
    "胸": ["ベンチプレス", "インクラインベンチプレス", "ダンベルフライ", "チェストプレス", "ペックフライ"],
    "背中": ["ラットプルダウン", "デッドリフト", "ベントオーバーロウ", "シーテッドロウ", "プルアップ"],
    "肩": ["ショルダープレス", "サイドレイズ", "フロントレイズ", "リアレイズ", "アップライトロウ"],
    "腕": ["アームカール", "トライセプスエクステンション", "ハンマーカール", "ディップス"],
    "腹筋": ["クランチ", "レッグレイズ", "プランク", "ロシアンツイスト"],
    "有酸素": ["トレッドミル", "エアロバイク", "ステアクライマー", "ローイングマシン", "縄跳び"],
    "その他": ["自由入力"],
